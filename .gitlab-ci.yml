# Lint and offline tests for the plugin. No secrets, no GitLab API calls:
# board-fetch runs against tests/fake-glab; Logic.js runs under node.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:
  # Pinned by digest (the multi-arch index of alpine:3.22 on 2026-11-04), so a
  # re-pushed tag can't change what runs. To move on: docker buildx imagetools inspect alpine:3.22
  image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  variables:
    # Omarchy v4.0.6 (the version on logain), pinned by commit and checksum.
    OMARCHY_COMMIT: 237f1b4071a0bff2296c6d740ba2b9fd695ebfa0
    VALIDATOR_SHA256: f7507e5042eb970e3dc918bdf6bf251c7557443892a77e71a17d7019ddde72c8
  script:
    - apk add --no-cache bash coreutils jq shellcheck curl findutils nodejs qt6-qtdeclarative-dev
    - for f in board-fetch tests/run.sh tests/fake-glab; do bash -n "$f" || exit 1; done
    - shellcheck board-fetch tests/run.sh tests/fake-glab
    - bash tests/run.sh
    - node --test tests/logic.test.js
    # Every mutation row still matches its file and names an existing test.
    - bash tests/mutate.sh --check . tests/mutations/*.tsv
    # Same checks as `omarchy plugin validate` (manifest JSON, schema, entry points, symlinks).
    - curl -fsSL -o /tmp/validate "https://raw.githubusercontent.com/basecamp/omarchy/$OMARCHY_COMMIT/bin/omarchy-plugin-validate"
    - echo "$VALIDATOR_SHA256  /tmp/validate" | sha256sum -c -
    - bash /tmp/validate .
    # Omarchy and Quickshell imports can't resolve outside the shell, so those
    # categories are off. Syntax errors and any other warning still fail.
    # Every QML file in the plugin, at the top and in components/.
    - /usr/lib/qt6/bin/qmllint --import disable --unqualified disable --missing-property disable --unresolved-type disable --max-warnings 0 $(find . -name "*.qml" -not -path "./tests/*" | sort)
